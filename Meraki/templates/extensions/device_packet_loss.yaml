zabbix_export:
  version: "7.4"
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Applications
    - uuid: 36bff6c29af64692839d077febfc7079
      name: Templates/Network devices
  templates:
    - uuid: 3e7afc986fd84de9ae14cca16be9a0b8
      template: Cisco Meraki device by HTTP - Packet Loss
      name: Cisco Meraki device by HTTP - Packet Loss
      description: 'Extends the official "Cisco Meraki device by HTTP" template (linked below, not duplicated) with an active on-demand ping test (packet loss + latency, via the Meraki live-ping-tool API) and richer device-info telemetry (public IP, firmware, last-seen, org/network name, tags). Attach this template instead of the base one; all of the base template''s own items, triggers and discovery rules come along via the template link.'
      templates:
        - name: Cisco Meraki device by HTTP
      groups:
        - name: Templates/Applications
        - name: Templates/Network devices
      items:
        - uuid: b42f49bc80484d328e23a54ed64c93db
          name: Get packet loss data
          type: SCRIPT
          key: meraki.get.packetloss
          delay: "{$MERAKI.PING.INTERVAL}"
          history: "0"
          value_type: TEXT
          params: |
            var params = JSON.parse(value);

            var request = new HttpRequest();
            request.addHeader("X-Cisco-Meraki-API-Key:" + params.token);
            request.addHeader("Content-Type: application/json");
            request.addHeader("User-Agent: ZabbixServer/1.2 Zabbix");

            if (typeof params.httpproxy !== "undefined" && params.httpproxy !== "") {
              request.setProxy(params.httpproxy);
            }

            if (params.token === "{" + "MERAKI.TOKEN}") {
              throw "Please change {MERAKI.TOKEN} macro to the proper value.";
            }

            if (
              params.url.indexOf("http://") === -1 &&
              params.url.indexOf("https://") === -1
            ) {
              params.url = "https://" + params.url;
            }
            if (params.url.slice(-1) !== "/") {
              params.url = params.url + "/";
            }

            var error_msg = "";
            var result = {};

            function getHttpData(method, url, body) {
              var response;
              if (method === "POST") {
                response = request.post(url, JSON.stringify(body));
              } else {
                response = request.get(url);
              }
              var status = request.getStatus();
              Zabbix.log(
                4,
                "[ Meraki API ] [ " +
                  url +
                  " ] Received response with status code " +
                  status +
                  ": " +
                  response
              );

              var parsed = null;
              if (response !== null && response !== "") {
                parsed = JSON.parse(response);
              }
              if (status !== 200 && status !== 201) {
                if (parsed !== null && parsed.errors) {
                  throw parsed.errors.join(", ");
                }
                throw (
                  "Failed to receive data: invalid response status code " + status + "."
                );
              }
              return parsed === null ? {} : parsed;
            }

            try {
              var createBody = {
                count: parseInt(params.count, 10) || 5,
                target: params.target,
              };

              var baseUrl =
                params.url +
                "devices/" +
                encodeURIComponent(params.serial) +
                "/liveTools/ping";
              var createResp = getHttpData("POST", baseUrl, createBody);

              if (!createResp.pingId) {
                throw "Failed to create ping job: no pingId returned.";
              }

              var pollUrl = baseUrl + "/" + createResp.pingId;
              var maxAttempts = 15;
              var attempt = 0;

              while (attempt < maxAttempts) {
                Zabbix.sleep(2000);
                result = getHttpData("GET", pollUrl, null);
                if (result.status === "complete" || result.status === "failed") {
                  break;
                }
                attempt++;
              }

              if (result.status !== "complete") {
                throw "Ping test did not complete in time. Last status: " + result.status;
              }
            } catch (error) {
              error_msg = error.toString();
            }

            return JSON.stringify({
              result: result,
              error: error_msg,
            });
          description: "Runs an on-demand ping test to {$MERAKI.PING.TARGET} via the Meraki live-ping-tool API and returns the raw poll result. Not stored — mirrored by the Latency/Packet loss dependent items below."
          timeout: "{$MERAKI.DATA.TIMEOUT}"
          parameters:
            - name: count
              value: "{$MERAKI.PING.COUNT}"
            - name: httpproxy
              value: "{$MERAKI.HTTP_PROXY}"
            - name: serial
              value: "{$SERIAL}"
            - name: target
              value: "{$MERAKI.PING.TARGET}"
            - name: token
              value: "{$MERAKI.TOKEN}"
            - name: url
              value: "{$MERAKI.API.URL}"
          tags:
            - tag: component
              value: raw
        - uuid: 63ee88e861254974b6759dae909b9e62
          name: "Latency, ms"
          type: DEPENDENT
          key: meraki.device.ping.latency
          history: 31d
          value_type: FLOAT
          trends: 365d
          units: ms
          description: "Average round-trip latency from the on-demand ping test."
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.result.results.latencies.average
              error_handler: DISCARD_VALUE
          master_item:
            key: meraki.get.packetloss
          tags:
            - tag: component
              value: network
          triggers:
            - uuid: 705f6b25b1df46cabef567cf3dddc7e9
              expression: min(/Cisco Meraki device by HTTP - Packet Loss/meraki.device.ping.latency,#3)>{$MERAKI.PING.LATENCY.HIGH}
              name: "Meraki: High latency to {$MERAKI.PING.TARGET} on {HOST.NAME}"
              priority: WARNING
              tags:
                - tag: scope
                  value: availability
        - uuid: 2c01243ea78c4d4ab99ddb8abbac9da7
          name: "Packet loss, %"
          type: DEPENDENT
          key: meraki.device.packetloss.pct
          history: 31d
          value_type: FLOAT
          trends: 365d
          units: "%"
          description: "Packet loss percentage from the on-demand ping test."
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.result.results.loss.percentage
              error_handler: DISCARD_VALUE
          master_item:
            key: meraki.get.packetloss
          tags:
            - tag: component
              value: network
          triggers:
            - uuid: 7f8ab086d6a2407b99f4264c8489a11a
              expression: min(/Cisco Meraki device by HTTP - Packet Loss/meraki.device.packetloss.pct,#3)>{$MERAKI.PING.LOSS}
              name: "Meraki: Packet loss to {$MERAKI.PING.TARGET} > {$MERAKI.PING.LOSS}%"
              priority: WARNING
              tags:
                - tag: scope
                  value: performance
        - uuid: 0dfcf14d1967455fadafebe7f7aaa993
          name: "Packet loss: API error"
          type: DEPENDENT
          key: meraki.get.packetloss.error
          history: 31d
          value_type: TEXT
          description: 'Error message from the last packet-loss poll, kept even when empty so "no error" is a real, queryable value.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.error
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: meraki.get.packetloss
          tags:
            - tag: component
              value: error
        - uuid: 40268e51caa442a0b5f8a2c4e8984d90
          name: Get device info
          type: SCRIPT
          key: meraki.get.deviceinfo
          delay: "{$MERAKI.DEVICESTATUS.INTERVAL}"
          history: "0"
          value_type: TEXT
          params: |
            var params = JSON.parse(value);

            var request = new HttpRequest();
            request.addHeader("X-Cisco-Meraki-API-Key:" + params.token);
            request.addHeader("Content-Type: application/json");
            request.addHeader("User-Agent: ZabbixServer/1.2 Zabbix");

            if (typeof params.httpproxy !== "undefined" && params.httpproxy !== "") {
              request.setProxy(params.httpproxy);
            }

            if (
              params.url.indexOf("http://") === -1 &&
              params.url.indexOf("https://") === -1
            ) {
              params.url = "https://" + params.url;
            }
            if (params.url.slice(-1) !== "/") {
              params.url = params.url + "/";
            }

            var error_msg = "";
            var result = {};

            // Deliberately its own poller rather than sharing meraki.device.get.status's
            // master item — that item may be the official template's own poller (reused
            // by resolve_device_status_item() to avoid a redundant one), whose JSON shape
            // is narrower and isn't ours to assume. This calls devices/statuses directly
            // so the full shape (publicIp, lastReportedAt, productType) is guaranteed.
            try {
              var statusUrl =
                params.url +
                "organizations/" +
                encodeURIComponent(params.orgid) +
                "/devices/statuses?serials%5B%5D=" +
                encodeURIComponent(params.serial);
              var t0 = Date.now();
              var statusResp = request.get(statusUrl);
              var responseTimeMs = Date.now() - t0;
              if (request.getStatus() !== 200) {
                throw "Failed to get device status: status " + request.getStatus();
              }
              var statusList = JSON.parse(statusResp);
              if (!statusList.length) {
                throw "No status entry returned for serial " + params.serial;
              }
              var device = statusList[0];

              var networkName = "";
              if (device.networkId) {
                var netResp = request.get(
                  params.url + "networks/" + encodeURIComponent(device.networkId)
                );
                if (request.getStatus() === 200) {
                  networkName = JSON.parse(netResp).name || "";
                }
              }

              var orgName = "";
              var orgResp = request.get(
                params.url + "organizations/" + encodeURIComponent(params.orgid)
              );
              if (request.getStatus() === 200) {
                orgName = JSON.parse(orgResp).name || "";
              }

              result = {
                publicIp: device.publicIp || "",
                lastReportedAtUnix: device.lastReportedAt
                  ? Math.floor(new Date(device.lastReportedAt).getTime() / 1000)
                  : 0,
                productType: device.productType || "",
                networkName: networkName,
                organizationName: orgName,
                tags: (device.tags || []).join(", "),
                apiResponseTimeMs: responseTimeMs,
                lastSuccessfulPollUnix: Math.floor(Date.now() / 1000),
              };
            } catch (error) {
              error_msg = error.toString();
            }

            return JSON.stringify({
              result: result,
              error: error_msg,
            });
          description: "Pulls device/network/org identity fields not covered by the base template's inventory poll (public IP, last-seen, product type, network/org name, tags) plus its own API response time. Not stored — mirrored by the dependent items below."
          timeout: "{$MERAKI.DATA.TIMEOUT}"
          parameters:
            - name: httpproxy
              value: "{$MERAKI.HTTP_PROXY}"
            - name: orgid
              value: "{$ORGANIZATION_ID}"
            - name: serial
              value: "{$SERIAL}"
            - name: token
              value: "{$MERAKI.TOKEN}"
            - name: url
              value: "{$MERAKI.API.URL}"
          tags:
            - tag: component
              value: raw
        - uuid: 8f4800a22b014ebe9b27ee4dc3e6ac00
          name: Public IP
          type: DEPENDENT
          key: meraki.device.info.publicip
          history: 31d
          value_type: TEXT
          description: "Device public IP, from the devices/statuses endpoint (independent of the base template's own inventory-derived Public IP item)."
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.result.publicIp
              error_handler: DISCARD_VALUE
          master_item:
            key: meraki.get.deviceinfo
          tags:
            - tag: component
              value: network
        - uuid: 5d8c92cb2dbb44ef80fdf82a436f2a8b
          name: Last seen
          type: DEPENDENT
          key: meraki.device.lastseen
          history: 31d
          value_type: UNSIGNED
          units: unixtime
          description: "Unix timestamp the device last reported to Meraki."
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.result.lastReportedAtUnix
              error_handler: DISCARD_VALUE
          master_item:
            key: meraki.get.deviceinfo
          tags:
            - tag: component
              value: health
        - uuid: 9bba635d76df43ebbe381f8e49ded95b
          name: Product type
          type: DEPENDENT
          key: meraki.device.producttype
          history: 31d
          value_type: TEXT
          description: "Meraki product type (e.g. wireless, appliance, switch)."
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.result.productType
              error_handler: DISCARD_VALUE
          master_item:
            key: meraki.get.deviceinfo
          tags:
            - tag: component
              value: system
        - uuid: f19ab0c41f07485898c27bf03ff11011
          name: Network name
          type: DEPENDENT
          key: meraki.device.networkname
          history: 31d
          value_type: TEXT
          description: "Name of the Meraki network this device belongs to."
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.result.networkName
              error_handler: DISCARD_VALUE
          master_item:
            key: meraki.get.deviceinfo
          tags:
            - tag: component
              value: system
        - uuid: e061e514b143486188a44396123c101b
          name: Organization name
          type: DEPENDENT
          key: meraki.device.organizationname
          history: 31d
          value_type: TEXT
          description: "Name of the Meraki organization this device belongs to."
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.result.organizationName
              error_handler: DISCARD_VALUE
          master_item:
            key: meraki.get.deviceinfo
          tags:
            - tag: component
              value: system
        - uuid: b2d02bad69674e4eb23864c2caaeb747
          name: AP tags
          type: DEPENDENT
          key: meraki.device.tags
          history: 31d
          value_type: TEXT
          description: "Comma-separated Meraki tags assigned to this device."
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.result.tags
              error_handler: DISCARD_VALUE
          master_item:
            key: meraki.get.deviceinfo
          tags:
            - tag: component
              value: system
        - uuid: bac13e62e25144ab97b00271f83664d3
          name: API response time
          type: DEPENDENT
          key: meraki.device.info.responsetime
          history: 31d
          value_type: FLOAT
          units: ms
          description: "Response time of the devices/statuses call made by the Get device info script item."
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.result.apiResponseTimeMs
              error_handler: DISCARD_VALUE
          master_item:
            key: meraki.get.deviceinfo
          tags:
            - tag: component
              value: health
        - uuid: f55eca0e33fe41979a091c9113a71b9d
          name: Last successful poll
          type: DEPENDENT
          key: meraki.device.info.lastsuccess
          history: 31d
          value_type: UNSIGNED
          units: unixtime
          description: "Unix timestamp of the last successful Get device info poll."
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.result.lastSuccessfulPollUnix
              error_handler: DISCARD_VALUE
          master_item:
            key: meraki.get.deviceinfo
          tags:
            - tag: component
              value: health
        - uuid: d21a1e31af8b4ffd91883cf4ea42a864
          name: "Device info: API error"
          type: DEPENDENT
          key: meraki.device.info.error
          history: 31d
          value_type: TEXT
          description: 'Error message from the last Get device info poll, kept even when empty so "no error" is a real, queryable value.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.error
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: meraki.get.deviceinfo
          tags:
            - tag: component
              value: error
      tags:
        - tag: class
          value: network
        - tag: target
          value: cisco-meraki-dashboard
      macros:
        - macro: "{$MERAKI.PING.COUNT}"
          value: "5"
          description: "Number of pings the Meraki live-ping-tool runs per packet-loss check."
        - macro: "{$MERAKI.PING.INTERVAL}"
          value: 50s
          description: "Polling interval for the packet-loss check."
        - macro: "{$MERAKI.PING.TARGET}"
          value: 8.8.8.8
          description: "Target IP pinged from the device to measure latency and packet loss."
        - macro: "{$MERAKI.PING.LOSS}"
          value: "20"
          description: "Packet loss threshold, in percent, above which the packet-loss trigger fires."
        - macro: "{$MERAKI.PING.LATENCY.HIGH}"
          value: "100"
          description: "Latency threshold, in ms, above which the high-latency trigger fires."
        - macro: "{$MERAKI.DEVICESTATUS.INTERVAL}"
          value: 5m
          description: "Polling interval for the Get device info script item."
        - macro: "{$MERAKI.FIRMWARE.EXPECTED}"
          description: "Expected firmware version. Leave blank to keep the firmware-outdated trigger inactive."
      dashboards:
        - uuid: f3647849a2b942eeb04bc6e9bebfc262
          name: "Meraki: Packet Loss"
          pages:
            - name: "Meraki: Packet Loss"
              widgets:
                - type: graphclassic
                  name: "Ping Latency"
                  width: "24"
                  height: "5"
                  fields:
                    - type: GRAPH
                      name: graphid.0
                      value:
                        host: Cisco Meraki device by HTTP - Packet Loss
                        name: "Meraki: Packet Loss - Ping Latency"
                    - type: STRING
                      name: reference
                      value: AAAAA
                - type: graphclassic
                  name: "Packet Loss %"
                  x: "24"
                  width: "24"
                  height: "5"
                  fields:
                    - type: GRAPH
                      name: graphid.0
                      value:
                        host: Cisco Meraki device by HTTP - Packet Loss
                        name: "Meraki: Packet Loss - Packet Loss %"
                    - type: STRING
                      name: reference
                      value: AAAAB
                - type: graphclassic
                  name: "API Response Time"
                  x: "48"
                  width: "24"
                  height: "5"
                  fields:
                    - type: GRAPH
                      name: graphid.0
                      value:
                        host: Cisco Meraki device by HTTP - Packet Loss
                        name: "Meraki: Packet Loss - API Response Time"
                    - type: STRING
                      name: reference
                      value: AAAAC
  triggers:
    - uuid: 30c2c477913e4ab8a809b8ac2260b7db
      expression: '{$MERAKI.FIRMWARE.EXPECTED}<>"" and last(/Cisco Meraki device by HTTP/meraki.device.firmware)<>{$MERAKI.FIRMWARE.EXPECTED}'
      name: "Meraki: {HOST.NAME} firmware outdated (expected {$MERAKI.FIRMWARE.EXPECTED})"
      priority: INFO
      description: "References the base template's own inherited Firmware item (meraki.device.firmware, CHAR) rather than duplicating it. Stays inactive while {$MERAKI.FIRMWARE.EXPECTED} is blank."
      tags:
        - tag: scope
          value: availability
    - uuid: 1af43986530e4eb79aa4da0aca9b9450
      expression: length(last(/Cisco Meraki device by HTTP/meraki.device.get.status.errors))>0 or length(last(/Cisco Meraki device by HTTP - Packet Loss/meraki.get.packetloss.error))>0 or length(last(/Cisco Meraki device by HTTP - Packet Loss/meraki.device.info.error))>0
      name: "Meraki: API failure polling {HOST.NAME}"
      priority: AVERAGE
      description: "First condition references the base template's own inherited status-poller error mirror; the other two are local to this template."
      tags:
        - tag: scope
          value: availability
  graphs:
    - uuid: 3f60cfa4871344cf9871f2cf3f18e95c
      name: "Meraki: Packet Loss - Ping Latency"
      ymin_type_1: FIXED
      graph_items:
        - color: 199C0D
          item:
            host: Cisco Meraki device by HTTP - Packet Loss
            key: meraki.device.ping.latency
    - uuid: 90820c587ad147b6b84a2ce4797ca873
      name: "Meraki: Packet Loss - Packet Loss %"
      ymin_type_1: FIXED
      graph_items:
        - color: 199C0D
          item:
            host: Cisco Meraki device by HTTP - Packet Loss
            key: meraki.device.packetloss.pct
    - uuid: 5b86b3ac345e4d96a97cde74f1f3a993
      name: "Meraki: Packet Loss - API Response Time"
      ymin_type_1: FIXED
      graph_items:
        - color: 199C0D
          item:
            host: Cisco Meraki device by HTTP - Packet Loss
            key: meraki.device.info.responsetime
