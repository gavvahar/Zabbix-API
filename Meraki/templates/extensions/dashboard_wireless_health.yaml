            - uuid: 7ace3d855c2840de815b0eeb8fe33217
              name: "Connection success rate (1h): {#NETWORK_NAME}"
              type: DEPENDENT
              key: meraki.network.connections.successrate.plb[{#NETWORK_ID}]
