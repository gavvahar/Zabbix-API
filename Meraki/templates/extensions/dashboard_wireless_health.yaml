        - uuid: b2b0d9b6cc524341883f3c36df6ec918
          name: SSID Discovery - PLB
          type: SCRIPT
          key: meraki.lld.ssids.plb
          delay: "{$MERAKI.LLD.INTERVAL}"
          params: |
            var params = JSON.parse(value);

            var request = new HttpRequest();
            request.addHeader("X-Cisco-Meraki-API-Key:" + params.token);
            request.addHeader("Content-Type: application/json");
            request.addHeader("User-Agent: ZabbixServer/1.2 Zabbix");

            if (typeof params.httpproxy !== "undefined" && params.httpproxy !== "") {
              request.setProxy(params.httpproxy);
            }

            var url = params.url;
            if (url.indexOf("http://") === -1 && url.indexOf("https://") === -1) {
              url = "https://" + url;
            }
            if (url.slice(-1) !== "/") {
              url = url + "/";
            }

            var netResponse = request.get(
              url + "networks/" + encodeURIComponent(params.networkid)
            );
            if (request.getStatus() !== 200) {
              throw "Failed to get network: status " + request.getStatus();
            }
            var net = JSON.parse(netResponse);

            var ssidResponse = request.get(
              url + "networks/" + encodeURIComponent(net.id) + "/wireless/ssids"
            );
            if (request.getStatus() !== 200) {
              throw "Failed to list SSIDs: status " + request.getStatus();
            }

            var data = [];
            var ssids = JSON.parse(ssidResponse);
            ssids.forEach(function (ssid) {
              if (!ssid.enabled) {
                return;
              }
              data.push({
