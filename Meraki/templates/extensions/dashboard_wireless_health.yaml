zabbix_export:
  version: "7.0"
  template_groups:
    - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
      name: Templates/Applications
    - uuid: 36bff6c29af64692839d077febfc7079
      name: Templates/Network devices
  templates:
    - uuid: bddca8c984064559bc5c9957df4374fb
      template: Cisco Meraki dashboard by HTTP - Wireless Health
      name: Cisco Meraki dashboard by HTTP - Wireless Health
      description: Extends the official "Cisco Meraki dashboard by HTTP" template (linked below, not duplicated) with per-network and per-SSID wireless health telemetry (client counts, auth failures, connection funnel stats, latency, throughput), per-radio channel/utilization data, and per-network-group bandwidth policy data, each via its own LLD rule. Attach this template instead of the base one; all of the base template's own items, triggers and discovery rules come along via the template link.
      templates:
        - name: Cisco Meraki dashboard by HTTP
      groups:
        - name: Templates/Applications
        - name: Templates/Network devices
      discovery_rules:
        - uuid: cd7bd6909092488aab7d9fefa247cfff
          name: Network Discovery - PLB
          type: SCRIPT
          key: meraki.lld.networks.plb
          delay: "{$MERAKI.LLD.INTERVAL}"
          params: |
            var params = JSON.parse(value);

            var request = new HttpRequest();
            request.addHeader("X-Cisco-Meraki-API-Key:" + params.token);
            request.addHeader("Content-Type: application/json");
            request.addHeader("User-Agent: ZabbixServer/1.2 Zabbix");

            if (typeof params.httpproxy !== "undefined" && params.httpproxy !== "") {
              request.setProxy(params.httpproxy);
            }

            var url = params.url;
            if (url.indexOf("http://") === -1 && url.indexOf("https://") === -1) {
              url = "https://" + url;
            }
            if (url.slice(-1) !== "/") {
              url = url + "/";
            }

            var response = request.get(
              url + "networks/" + encodeURIComponent(params.networkid)
            );
            if (request.getStatus() !== 200) {
              throw "Failed to get network: status " + request.getStatus();
            }

            var net = JSON.parse(response);
            var data = [{
              "{#NETWORK_ID}": net.id,
              "{#NETWORK_NAME}": net.name,
            }];

            return JSON.stringify({ data: data });
          lifetime: 7d
          item_prototypes:
            - uuid: 0e3f32928e3b42cd87d3fbcec46dddd8
              name: "Client count: {#NETWORK_NAME}"
              type: SCRIPT
              key: meraki.network.clientcount.plb[{#NETWORK_ID}]
              delay: "{$MERAKI.LLD.INTERVAL}"
              history: 31d
              value_type: UNSIGNED
              params: |
                var params = JSON.parse(value);

                var request = new HttpRequest();
                request.addHeader("X-Cisco-Meraki-API-Key:" + params.token);
                request.addHeader("Content-Type: application/json");
                request.addHeader("User-Agent: ZabbixServer/1.2 Zabbix");

                if (typeof params.httpproxy !== "undefined" && params.httpproxy !== "") {
                  request.setProxy(params.httpproxy);
                }

                var url = params.url;
                if (url.indexOf("http://") === -1 && url.indexOf("https://") === -1) {
                  url = "https://" + url;
                }
                if (url.slice(-1) !== "/") {
                  url = url + "/";
                }

                var response = request.get(
                  url +
                    "networks/" +
                    encodeURIComponent(params.networkid) +
                    "/clients?timespan=300&perPage=5000"
                );
                if (request.getStatus() !== 200) {
                  throw "Failed to list clients: status " + request.getStatus();
                }

                return JSON.parse(response).length;
              timeout: "{$MERAKI.DATA.TIMEOUT}"
              parameters:
                - name: httpproxy
                  value: "{$MERAKI.HTTP_PROXY}"
                - name: networkid
                  value: "{#NETWORK_ID}"
                - name: token
                  value: "{$MERAKI.TOKEN}"
                - name: url
                  value: "{$MERAKI.API.URL}"
              tags:
                - tag: component
                  value: network
              trigger_prototypes:
                - uuid: 5899aecca27542cc8e6fb9c42cf76b4d
                  expression: last(/Cisco Meraki dashboard by HTTP - Wireless Health/meraki.network.clientcount.plb[{#NETWORK_ID}])>{$MERAKI.CLIENTCOUNT.HIGH}
                  name: "Meraki: High client count on {#NETWORK_NAME}"
                  priority: WARNING
                  tags:
                    - tag: scope
                      value: performance
            - uuid: 1edd0b69dea74b66b8955881d5a55bbe
              name: "Client count trend (vs 1h avg): {#NETWORK_NAME}"
              type: CALCULATED
              key: meraki.network.clientcount.trend.plb[{#NETWORK_ID}]
              delay: "{$MERAKI.LLD.INTERVAL}"
              history: 31d
              value_type: FLOAT
              units: "%"
              params: (last(//meraki.network.clientcount[{#NETWORK_ID}])-avg(//meraki.network.clientcount[{#NETWORK_ID}],1h))/(avg(//meraki.network.clientcount[{#NETWORK_ID}],1h)+0.001)*100
              tags:
                - tag: component
                  value: network
              trigger_prototypes:
                - uuid: 95bc6179085042afaf7d50977388169e
                  expression: abs(last(/Cisco Meraki dashboard by HTTP - Wireless Health/meraki.network.clientcount.trend.plb[{#NETWORK_ID}]))>{$MERAKI.CLIENTCOUNT.TREND.THRESHOLD}
                  name: "Meraki: Client count trend abnormal on {#NETWORK_NAME}"
                  priority: WARNING
                  tags:
                    - tag: scope
                      value: performance
            - uuid: cea836be9cdc4247869bb204333018d3
              name: "Auth failures (1h): {#NETWORK_NAME}"
              type: SCRIPT
              key: meraki.network.authfailures.plb[{#NETWORK_ID}]
              delay: "{$MERAKI.LLD.INTERVAL}"
              history: 31d
              value_type: UNSIGNED
              params: |
                var params = JSON.parse(value);

                var request = new HttpRequest();
                request.addHeader("X-Cisco-Meraki-API-Key:" + params.token);
                request.addHeader("Content-Type: application/json");
                request.addHeader("User-Agent: ZabbixServer/1.2 Zabbix");

                if (typeof params.httpproxy !== "undefined" && params.httpproxy !== "") {
                  request.setProxy(params.httpproxy);
                }

                var url = params.url;
                if (url.indexOf("http://") === -1 && url.indexOf("https://") === -1) {
                  url = "https://" + url;
                }
                if (url.slice(-1) !== "/") {
                  url = url + "/";
                }

                var response = request.get(
                  url +
                    "networks/" +
                    encodeURIComponent(params.networkid) +
                    "/wireless/failedConnections?timespan=3600"
                );
                if (request.getStatus() !== 200) {
                  throw "Failed to list failed connections: status " + request.getStatus();
                }

                var events = JSON.parse(response);
                return events.filter(function (e) {
                  return e.type === "auth";
                }).length;
              timeout: "{$MERAKI.DATA.TIMEOUT}"
              parameters:
                - name: httpproxy
                  value: "{$MERAKI.HTTP_PROXY}"
                - name: networkid
                  value: "{#NETWORK_ID}"
                - name: token
                  value: "{$MERAKI.TOKEN}"
                - name: url
                  value: "{$MERAKI.API.URL}"
              tags:
                - tag: component
                  value: network
            - uuid: 9f8b061c12fd4911854078fccfd89954
              name: "Connection stats: {#NETWORK_NAME}"
              type: SCRIPT
              key: meraki.network.connectionstats.plb[{#NETWORK_ID}]
              delay: "{$MERAKI.LLD.INTERVAL}"
              history: "0"
              value_type: TEXT
              params: |
                var params = JSON.parse(value);

                var request = new HttpRequest();
                request.addHeader("X-Cisco-Meraki-API-Key:" + params.token);
                request.addHeader("Content-Type: application/json");
                request.addHeader("User-Agent: ZabbixServer/1.2 Zabbix");

                if (typeof params.httpproxy !== "undefined" && params.httpproxy !== "") {
                  request.setProxy(params.httpproxy);
                }

                var url = params.url;
                if (url.indexOf("http://") === -1 && url.indexOf("https://") === -1) {
                  url = "https://" + url;
                }
                if (url.slice(-1) !== "/") {
                  url = url + "/";
                }

                var error_msg = "";
                var result = {};

                try {
                  var response = request.get(
                    url +
                      "networks/" +
                      encodeURIComponent(params.networkid) +
                      "/wireless/connectionStats?timespan=3600"
                  );
                  if (request.getStatus() !== 200) {
                    throw "Failed to get connection stats: status " + request.getStatus();
                  }
                  var stats = JSON.parse(response);
                  var assoc = stats.assoc || 0;
                  var auth = stats.auth || 0;
                  var dhcp = stats.dhcp || 0;
                  var dns = stats.dns || 0;
                  var success = stats.success || 0;
                  var total = assoc + auth + dhcp + dns + success;
                  result = {
                    dhcp: dhcp,
                    dns: dns,
                    successRatePct: total > 0 ? (success / total) * 100 : 0,
                  };
                } catch (error) {
                  error_msg = error.toString();
                }

                return JSON.stringify({
                  result: result,
                  error: error_msg,
                });
              timeout: "{$MERAKI.DATA.TIMEOUT}"
              parameters:
                - name: httpproxy
                  value: "{$MERAKI.HTTP_PROXY}"
                - name: networkid
                  value: "{#NETWORK_ID}"
                - name: token
                  value: "{$MERAKI.TOKEN}"
                - name: url
                  value: "{$MERAKI.API.URL}"
              tags:
                - tag: component
                  value: raw
            - uuid: 686cc0a92b64400ea75bb61217f370ac
              name: "DHCP failures (1h): {#NETWORK_NAME}"
              type: DEPENDENT
              key: meraki.network.dhcpfailures.plb[{#NETWORK_ID}]
              history: 31d
              value_type: UNSIGNED
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.result.dhcp
                  error_handler: DISCARD_VALUE
              master_item:
                key: meraki.network.connectionstats.plb[{#NETWORK_ID}]
              tags:
                - tag: component
                  value: network
            - uuid: dbc2dc883c774267bf84a59316bafa34
              name: "DNS failures (1h): {#NETWORK_NAME}"
              type: DEPENDENT
              key: meraki.network.dnsfailures.plb[{#NETWORK_ID}]
