              tags:
                - tag: component
                  value: network
            - uuid: 4b4dfbaa6717474a9df8eb02a1791de0
              name: "Video latency (1h): {#NETWORK_NAME}"
              type: DEPENDENT
              key: meraki.network.latency.video.plb[{#NETWORK_ID}]
              history: 31d
