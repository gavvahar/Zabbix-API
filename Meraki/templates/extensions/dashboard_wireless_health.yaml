            - uuid: 6519a27ea60845baae16b609d13cc007
              name: "Latency stats: {#NETWORK_NAME}"
              type: SCRIPT
              key: meraki.network.latencystats.plb[{#NETWORK_ID}]
              delay: "{$MERAKI.LLD.INTERVAL}"
              history: "0"
              value_type: TEXT
              params: |
                var params = JSON.parse(value);

                var request = new HttpRequest();
                request.addHeader("X-Cisco-Meraki-API-Key:" + params.token);
                request.addHeader("Content-Type: application/json");
                request.addHeader("User-Agent: ZabbixServer/1.2 Zabbix");

                if (typeof params.httpproxy !== "undefined" && params.httpproxy !== "") {
                  request.setProxy(params.httpproxy);
                }

                var url = params.url;
                if (url.indexOf("http://") === -1 && url.indexOf("https://") === -1) {
                  url = "https://" + url;
                }
                if (url.slice(-1) !== "/") {
                  url = url + "/";
                }

                var error_msg = "";
                var result = {};

                try {
                  var response = request.get(
                    url +
                      "networks/" +
                      encodeURIComponent(params.networkid) +
                      "/wireless/latencyStats?timespan=3600"
                  );
                  if (request.getStatus() !== 200) {
                    throw "Failed to get latency stats: status " + request.getStatus();
                  }
                  var stats = JSON.parse(response);
                  result = {
                    voice:
                      stats.voiceTraffic && stats.voiceTraffic.avg != null
                        ? stats.voiceTraffic.avg
                        : 0,
                    video:
                      stats.videoTraffic && stats.videoTraffic.avg != null
                        ? stats.videoTraffic.avg
                        : 0,
                    bestEffort:
                      stats.bestEffortTraffic && stats.bestEffortTraffic.avg != null
                        ? stats.bestEffortTraffic.avg
                        : 0,
                    background:
                      stats.backgroundTraffic && stats.backgroundTraffic.avg != null
                        ? stats.backgroundTraffic.avg
                        : 0,
                  };
                } catch (error) {
                  error_msg = error.toString();
                }

                return JSON.stringify({
                  result: result,
                  error: error_msg,
                });
              timeout: "{$MERAKI.DATA.TIMEOUT}"
              parameters:
                - name: httpproxy
                  value: "{$MERAKI.HTTP_PROXY}"
                - name: networkid
                  value: "{#NETWORK_ID}"
                - name: token
                  value: "{$MERAKI.TOKEN}"
                - name: url
                  value: "{$MERAKI.API.URL}"
              tags:
                - tag: component
                  value: raw
            - uuid: 2b0a92681e934437987e2683d99df5e5
              name: "Voice latency (1h): {#NETWORK_NAME}"
              type: DEPENDENT
              key: meraki.network.latency.voice.plb[{#NETWORK_ID}]
              history: 31d
              value_type: FLOAT
              units: ms
              preprocessing:
                - type: JSONPATH
