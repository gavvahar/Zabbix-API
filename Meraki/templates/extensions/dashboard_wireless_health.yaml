              expression: last(/Cisco Meraki dashboard by HTTP - Wireless Health/meraki.network.authfailures.plb[{#NETWORK_ID}])>{$MERAKI.AUTHFAIL.HIGH} or last(/Cisco Meraki dashboard by HTTP - Wireless Health/meraki.network.clientcount.plb[{#NETWORK_ID}])>({$MERAKI.CLIENTCOUNT.HIGH}*2)
