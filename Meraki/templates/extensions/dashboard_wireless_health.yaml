            - uuid: f62f6beff0084fad9f145bdc9bdf375c
              name: "Background latency (1h): {#NETWORK_NAME}"
              type: DEPENDENT
              key: meraki.network.latency.background.plb[{#NETWORK_ID}]
              history: 31d
              value_type: FLOAT
              units: ms
