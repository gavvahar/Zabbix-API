            - uuid: 51a1ce64dfba4aca81f942c5d20aa572
              name: "Best effort latency (1h): {#NETWORK_NAME}"
              type: DEPENDENT
              key: meraki.network.latency.besteffort.plb[{#NETWORK_ID}]
              history: 31d
