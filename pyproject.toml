# =============================================================================
# RUFF — Python linter & formatter
# =============================================================================

[tool.ruff]
line-length = 180
exclude = ["__pycache__", "venv", ".tox", ".venv", "tests.py", "env"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E203", "E501", "E701", "E401", "B008"]


# =============================================================================
# TOX — Test & task runner
# =============================================================================

# Default envs run when you type `tox` with no arguments
[tool.tox]
env_list = ["lint", "txt-lint", "format", "prettier", "toml-lint"]
work_dir = "/tmp/.tox"

# Shared base config inherited by all envs
[tool.tox.env_run_base]
pass_env = ["PATH"]
set_env = { VIRTUALENV_OVERRIDE_APP_DATA = "{work_dir}/.virtualenv" }

# --- Linting ----------------------------------------------------------------


[tool.tox.env."combined-imports-check"]
skip_install = true
deps = []
commands = [["python3", "Python/scripts/combined_imports_check.py"]]

[tool.tox.env."no-classes-check"]
skip_install = true
deps = []
commands = [["python3", "Python/scripts/no_classes_check.py"]]

[tool.tox.env.prettier]
skip_install = true
allowlist_externals = ["npx"]
commands = [["npx", "prettier", "--check", "**/*.{json,yml,yaml,md}"]]

# --- Formatting -------------------------------------------------------------

[tool.tox.env.format]
skip_install = true
deps = ["ruff", "ty"]
allowlist_externals = ["npx"]
commands = [
  [
    "python3",
    "Python/scripts/combined_imports_check.py",
    "--fix",
  ],
  [
    "npx",
    "prettier",
    "--write",
    "--log-level",
    "log",
    "**/*.{json,yml,yaml,md}",
  ],
  [
    "ruff",
    "format",
    "--no-cache",
    "--verbose",
    ".",
  ],
  [
    "ruff",
    "check",
    "--no-cache",
    "--fix",
    "--verbose",
    ".",
  ],
  [
    "npx",
    "@taplo/cli",
    "fmt",
    "--no-auto-config",
    "**/*.toml",
  ],
]


[tool.tox.env."toml-lint"]
skip_install = true
allowlist_externals = ["npx"]
commands = [
  [
    "npx",
    "@taplo/cli",
    "fmt",
    "--check",
    "--no-auto-config",
    "**/*.toml",
  ],
  [
    "npx",
    "@taplo/cli",
    "lint",
    "--no-auto-config",
    "**/*.toml",
  ],
]


# --- Aggregate (CI) ---------------------------------------------------------

# Runs the full CI chain: no-classes-check → lint → txt-lint → prettier → tests
[tool.tox.env.github]
skip_install = true
deps = []
allowlist_externals = ["tox"]
commands = [
  [
    "tox",
    "-e",
    "no-classes-check",
  ],
  [
    "tox",
    "-e",
    "toml-lint",
  ],
  [
    "tox",
    "-e",
    "combined-imports-check",
  ],
  [
    "tox",
    "-e",
    "prettier",
  ],
]

# Runs format then the full github chain
[tool.tox.env.all]
skip_install = true
deps = []
allowlist_externals = ["tox"]
commands = [["tox", "-e", "format"], ["tox", "-e", "github"]]