    - uuid: 18d535fba3ed4588a07c048d5bd5c985
      name: Radio Discovery
      type: SCRIPT
      key: meraki.lld.radios
      delay: '{$MERAKI.LLD.INTERVAL}'
      timeout: '{$MERAKI.DATA.TIMEOUT}'
      lifetime: 7d
      params: |
        var params = JSON.parse(value);

        var request = new HttpRequest();
        request.addHeader("X-Cisco-Meraki-API-Key:" + params.token);
        request.addHeader("Content-Type: application/json");
        request.addHeader("User-Agent: ZabbixServer/1.2 Zabbix");

        if (typeof params.httpproxy !== "undefined" && params.httpproxy !== "") {
          request.setProxy(params.httpproxy);
        }

        var url = params.url;
        if (url.indexOf("http://") === -1 && url.indexOf("https://") === -1) {
          url = "https://" + url;
        }
        if (url.slice(-1) !== "/") {
          url = url + "/";
        }

        // Uses the SSID-status-by-device endpoint (not channelUtilization/byDevice)
        // specifically because it exposes each radio's index — some APs run two
        // physical radios on the same band (e.g. dual 5GHz), which channel
        // utilization alone can't distinguish. {#RADIO_INDEX} is what makes those
        // radios discoverable as separate entities instead of colliding.
        var response = request.get(
          url +
            "organizations/" +
            encodeURIComponent(params.orgid) +
            "/wireless/ssids/statuses/byDevice?perPage=500",
        );
        if (request.getStatus() !== 200) {
          throw "Failed to list radio statuses: status " + request.getStatus();
        }

        var result = JSON.parse(response);
        var seen = {};
        var data = [];
        (result.items || []).forEach(function (device) {
          (device.basicServiceSets || []).forEach(function (bss) {
            if (!bss.radio) {
              return;
            }
            var key = device.serial + ":" + bss.radio.band + ":" + bss.radio.index;
            if (seen[key]) {
              return;
            }
            seen[key] = true;
            data.push({
              "{#SERIAL}": device.serial,
              "{#AP_NAME}": device.name || device.serial,
              "{#RADIO_BAND}": bss.radio.band,
              "{#RADIO_INDEX}": bss.radio.index,
            });
          });
        });

        return JSON.stringify({ data: data });
      parameters:
      - name: httpproxy
        value: '{$MERAKI.HTTP_PROXY}'
      - name: orgid
        value: '{$MERAKI.ORG.ID}'
      - name: token
        value: '{$MERAKI.TOKEN}'
      - name: url
        value: '{$MERAKI.API.URL}'
      item_prototypes:
      - uuid: 398ab9d2dc484ecd90202e9e2fde12ef
        name: 'Channel utilization: {#AP_NAME} ({#RADIO_BAND}GHz, radio {#RADIO_INDEX})'
        type: SCRIPT
        key: meraki.radio.utilization[{#SERIAL},{#RADIO_BAND},{#RADIO_INDEX}]
        delay: '{$MERAKI.LLD.INTERVAL}'
        timeout: '{$MERAKI.DATA.TIMEOUT}'
        value_type: FLOAT
        units: '%'
        history: 31d
        params: |
          var params = JSON.parse(value);

          var request = new HttpRequest();
          request.addHeader("X-Cisco-Meraki-API-Key:" + params.token);
          request.addHeader("Content-Type: application/json");
          request.addHeader("User-Agent: ZabbixServer/1.2 Zabbix");

          if (typeof params.httpproxy !== "undefined" && params.httpproxy !== "") {
            request.setProxy(params.httpproxy);
          }

          var url = params.url;
          if (url.indexOf("http://") === -1 && url.indexOf("https://") === -1) {
            url = "https://" + url;
          }
          if (url.slice(-1) !== "/") {
            url = url + "/";
          }

          var response = request.get(
            url +
              "organizations/" +
              encodeURIComponent(params.orgid) +
              "/wireless/devices/channelUtilization/byDevice?perPage=500",
          );
          if (request.getStatus() !== 200) {
            throw "Failed to list channel utilization: status " + request.getStatus();
          }

          var devices = JSON.parse(response);
          var device = null;
          for (var i = 0; i < devices.length; i++) {
            if (devices[i].serial === params.serial) {
              device = devices[i];
              break;
            }
          }
          if (device === null) {
            throw "No utilization data for " + params.serial;
          }

          var band = null;
          (device.byBand || []).forEach(function (b) {
            if (b.band === params.band) {
              band = b;
            }
          });
          if (band === null) {
            throw "No band data for " + params.band + " on " + params.serial;
          }

          return band.utilization != null ? band.utilization : 0;
        parameters:
        - name: band
          value: '{#RADIO_BAND}'
        - name: httpproxy
          value: '{$MERAKI.HTTP_PROXY}'
        - name: orgid
          value: '{$MERAKI.ORG.ID}'
        - name: serial
          value: '{#SERIAL}'
        - name: token
          value: '{$MERAKI.TOKEN}'
        - name: url
          value: '{$MERAKI.API.URL}'
        tags:
        - tag: component
          value: radio
      - uuid: 74119a4578564d9c81eab8ac55f41694
        name: 'Radio status: {#AP_NAME} ({#RADIO_BAND}GHz, radio {#RADIO_INDEX})'
        type: SCRIPT
        key: meraki.radio.status[{#SERIAL},{#RADIO_BAND},{#RADIO_INDEX}]
        delay: '{$MERAKI.LLD.INTERVAL}'
        timeout: '{$MERAKI.DATA.TIMEOUT}'
        value_type: TEXT
        history: '0'
        params: |
          var params = JSON.parse(value);

          var request = new HttpRequest();
          request.addHeader("X-Cisco-Meraki-API-Key:" + params.token);
          request.addHeader("Content-Type: application/json");
          request.addHeader("User-Agent: ZabbixServer/1.2 Zabbix");

          if (typeof params.httpproxy !== "undefined" && params.httpproxy !== "") {
            request.setProxy(params.httpproxy);
          }

          var url = params.url;
          if (url.indexOf("http://") === -1 && url.indexOf("https://") === -1) {
            url = "https://" + url;
          }
          if (url.slice(-1) !== "/") {
            url = url + "/";
          }

          var error_msg = "";
          var result = {};

          try {
            var response = request.get(
              url +
                "organizations/" +
                encodeURIComponent(params.orgid) +
                "/wireless/ssids/statuses/byDevice?serials%5B%5D=" +
                encodeURIComponent(params.serial),
            );
            if (request.getStatus() !== 200) {
              throw "Failed to get radio status: status " + request.getStatus();
            }
            var parsed = JSON.parse(response);
            var device = (parsed.items || [])[0];
            var radios = {};
            if (device) {
              (device.basicServiceSets || []).forEach(function (bss) {
                if (!bss.radio) {
                  return;
                }
                var key = bss.radio.band + "_" + bss.radio.index;
                if (!radios[key]) {
                  radios[key] = {
                    channel: bss.radio.channel,
                    channelWidth: bss.radio.channelWidth,
                    power: bss.radio.power,
                    broadcasting: false,
                    ssidNames: [],
                  };
                }
                if (bss.radio.isBroadcasting) {
                  radios[key].broadcasting = true;
                  if (bss.ssid && bss.ssid.name) {
                    radios[key].ssidNames.push(bss.ssid.name);
                  }
                }
              });
            }
            Object.keys(radios).forEach(function (key) {
              radios[key].ssids = radios[key].ssidNames.join(", ");
              delete radios[key].ssidNames;
            });
            result = { radios: radios };
          } catch (error) {
            error_msg = error.toString();
          }

          return JSON.stringify({
            result: result,
            error: error_msg,
          });
        parameters:
        - name: httpproxy
          value: '{$MERAKI.HTTP_PROXY}'
        - name: orgid
          value: '{$MERAKI.ORG.ID}'
        - name: serial
          value: '{#SERIAL}'
        - name: token
          value: '{$MERAKI.TOKEN}'
        - name: url
          value: '{$MERAKI.API.URL}'
        tags:
        - tag: component
          value: raw
      - uuid: e7fc699ed8ff4fd7afd1b3407ddc8b48
