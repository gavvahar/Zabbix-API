zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: a571c0d144b14fd4a87a9d9b2aa9fcd6
    name: Templates/Applications
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: bddca8c984064559bc5c9957df4374fb
    template: Cisco Meraki dashboard by HTTP - Wireless Health
    name: Cisco Meraki dashboard by HTTP - Wireless Health
    description: Extends the official "Cisco Meraki dashboard by HTTP" template (linked below, not duplicated) with per-network and per-SSID wireless health telemetry (client counts, auth failures, connection funnel stats, latency, throughput), per-radio channel/utilization data, and per-network-group bandwidth policy data, each via its own LLD rule. Attach this template instead of the base one; all of the base template's own items, triggers and discovery rules come along via the template link.
    groups:
    - name: Templates/Applications
    - name: Templates/Network devices
    templates:
    - name: Cisco Meraki dashboard by HTTP
    discovery_rules:
    - uuid: 8c9d1195d535484b80d5677abf922f97
      name: Network Discovery
      type: SCRIPT
      key: meraki.lld.networks
      delay: '{$MERAKI.LLD.INTERVAL}'
      timeout: '{$MERAKI.DATA.TIMEOUT}'
      lifetime: 7d
      params: |
        var params = JSON.parse(value);

        var request = new HttpRequest();
        request.addHeader("X-Cisco-Meraki-API-Key:" + params.token);
        request.addHeader("Content-Type: application/json");
        request.addHeader("User-Agent: ZabbixServer/1.2 Zabbix");

        if (typeof params.httpproxy !== "undefined" && params.httpproxy !== "") {
          request.setProxy(params.httpproxy);
        }

        var url = params.url;
        if (url.indexOf("http://") === -1 && url.indexOf("https://") === -1) {
          url = "https://" + url;
        }
        if (url.slice(-1) !== "/") {
          url = url + "/";
        }

        var response = request.get(
          url + "organizations/" + encodeURIComponent(params.orgid) + "/networks",
        );
        if (request.getStatus() !== 200) {
          throw "Failed to list networks: status " + request.getStatus();
        }

        var networks = JSON.parse(response);
        var data = [];
        networks.forEach(function (net) {
          data.push({
            "{#NETWORK_ID}": net.id,
            "{#NETWORK_NAME}": net.name,
          });
        });

        return JSON.stringify({ data: data });
      parameters:
      - name: httpproxy
        value: '{$MERAKI.HTTP_PROXY}'
      - name: orgid
        value: '{$MERAKI.ORG.ID}'
      - name: token
        value: '{$MERAKI.TOKEN}'
      - name: url
        value: '{$MERAKI.API.URL}'
      item_prototypes:
      - uuid: dfcae868f646436f8283af93a486befa
        name: 'Client count: {#NETWORK_NAME}'
        type: SCRIPT
        key: meraki.network.clientcount[{#NETWORK_ID}]
        delay: '{$MERAKI.LLD.INTERVAL}'
        timeout: '{$MERAKI.DATA.TIMEOUT}'
        value_type: UNSIGNED
        history: 31d
        params: |
          var params = JSON.parse(value);

          var request = new HttpRequest();
          request.addHeader("X-Cisco-Meraki-API-Key:" + params.token);
          request.addHeader("Content-Type: application/json");
          request.addHeader("User-Agent: ZabbixServer/1.2 Zabbix");

          if (typeof params.httpproxy !== "undefined" && params.httpproxy !== "") {
            request.setProxy(params.httpproxy);
          }

          var url = params.url;
          if (url.indexOf("http://") === -1 && url.indexOf("https://") === -1) {
            url = "https://" + url;
          }
          if (url.slice(-1) !== "/") {
            url = url + "/";
          }

          var response = request.get(
            url +
              "networks/" +
              encodeURIComponent(params.networkid) +
              "/clients?timespan=300",
          );
          if (request.getStatus() !== 200) {
            throw "Failed to list clients: status " + request.getStatus();
          }

          return JSON.parse(response).length;
        parameters:
        - name: httpproxy
          value: '{$MERAKI.HTTP_PROXY}'
        - name: networkid
          value: '{#NETWORK_ID}'
        - name: token
          value: '{$MERAKI.TOKEN}'
        - name: url
          value: '{$MERAKI.API.URL}'
        tags:
        - tag: component
          value: network
      - uuid: 6296a9001d2a4151a5eabf12c2df517d
        name: 'Client count trend (vs 1h avg): {#NETWORK_NAME}'
        type: CALCULATED
        key: meraki.network.clientcount.trend[{#NETWORK_ID}]
        delay: '{$MERAKI.LLD.INTERVAL}'
        value_type: FLOAT
        units: '%'
        history: 31d
        params: (last(//meraki.network.clientcount[{#NETWORK_ID}])-avg(//meraki.network.clientcount[{#NETWORK_ID}],1h))/(avg(//meraki.network.clientcount[{#NETWORK_ID}],1h)+0.001)*100
        tags:
        - tag: component
          value: network
      - uuid: d224c6f997424b429c11ed8208efd3ed
        name: 'Auth failures (1h): {#NETWORK_NAME}'
        type: SCRIPT
        key: meraki.network.authfailures[{#NETWORK_ID}]
        delay: '{$MERAKI.LLD.INTERVAL}'
        timeout: '{$MERAKI.DATA.TIMEOUT}'
        value_type: UNSIGNED
        history: 31d
        params: |
          var params = JSON.parse(value);

          var request = new HttpRequest();
          request.addHeader("X-Cisco-Meraki-API-Key:" + params.token);
          request.addHeader("Content-Type: application/json");
          request.addHeader("User-Agent: ZabbixServer/1.2 Zabbix");

          if (typeof params.httpproxy !== "undefined" && params.httpproxy !== "") {
            request.setProxy(params.httpproxy);
          }

          var url = params.url;
          if (url.indexOf("http://") === -1 && url.indexOf("https://") === -1) {
            url = "https://" + url;
          }
          if (url.slice(-1) !== "/") {
            url = url + "/";
          }

          var response = request.get(
            url +
              "networks/" +
              encodeURIComponent(params.networkid) +
              "/wireless/failedConnections?timespan=3600",
          );
          if (request.getStatus() !== 200) {
            throw "Failed to list failed connections: status " + request.getStatus();
          }

          var events = JSON.parse(response);
          return events.filter(function (e) {
            return e.type === "auth";
          }).length;
        parameters:
        - name: httpproxy
          value: '{$MERAKI.HTTP_PROXY}'
        - name: networkid
          value: '{#NETWORK_ID}'
        - name: token
          value: '{$MERAKI.TOKEN}'
        - name: url
          value: '{$MERAKI.API.URL}'
        tags:
        - tag: component
          value: network
      - uuid: bfce0efc2e8b461b8d5152bc65283d86
        name: 'Connection stats: {#NETWORK_NAME}'
        type: SCRIPT
        key: meraki.network.connectionstats[{#NETWORK_ID}]
        delay: '{$MERAKI.LLD.INTERVAL}'
        timeout: '{$MERAKI.DATA.TIMEOUT}'
        value_type: TEXT
        history: '0'
        params: |
          var params = JSON.parse(value);

          var request = new HttpRequest();
          request.addHeader("X-Cisco-Meraki-API-Key:" + params.token);
          request.addHeader("Content-Type: application/json");
          request.addHeader("User-Agent: ZabbixServer/1.2 Zabbix");

          if (typeof params.httpproxy !== "undefined" && params.httpproxy !== "") {
            request.setProxy(params.httpproxy);
          }

          var url = params.url;
          if (url.indexOf("http://") === -1 && url.indexOf("https://") === -1) {
            url = "https://" + url;
          }
          if (url.slice(-1) !== "/") {
            url = url + "/";
          }

          var error_msg = "";
          var result = {};

          try {
            var response = request.get(
              url +
                "networks/" +
                encodeURIComponent(params.networkid) +
                "/wireless/connectionStats?timespan=3600",
            );
            if (request.getStatus() !== 200) {
              throw "Failed to get connection stats: status " + request.getStatus();
            }
            var stats = JSON.parse(response);
            var assoc = stats.assoc || 0;
            var auth = stats.auth || 0;
            var dhcp = stats.dhcp || 0;
            var dns = stats.dns || 0;
            var success = stats.success || 0;
            var total = assoc + auth + dhcp + dns + success;
            result = {
              dhcp: dhcp,
              dns: dns,
              successRatePct: total > 0 ? (success / total) * 100 : 0,
            };
          } catch (error) {
            error_msg = error.toString();
          }

          return JSON.stringify({
            result: result,
            error: error_msg,
          });
        parameters:
        - name: httpproxy
          value: '{$MERAKI.HTTP_PROXY}'
        - name: networkid
