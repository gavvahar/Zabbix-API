        name: 'Bandwidth limit down: {#GROUP_POLICY_NAME} on {#NETWORK_NAME}'
        type: DEPENDENT
        key: meraki.clientgroup.bandwidth.down[{#NETWORK_ID},{#GROUP_POLICY_ID}]
        value_type: FLOAT
        units: Kbps
        history: 31d
        preprocessing:
        - type: JSONPATH
          parameters:
          - $.result.limitDownKbps
          error_handler: DISCARD_VALUE
        master_item:
          key: meraki.clientgroup.detail[{#NETWORK_ID},{#GROUP_POLICY_ID}]
        tags:
        - tag: component
          value: clientgroup
    tags:
    - tag: class
      value: network
    - tag: target
      value: cisco-meraki-dashboard
    macros:
    - macro: '{$MERAKI.LLD.INTERVAL}'
      value: 1h
      description: Polling interval for all 4 discovery rules and the client-count-trend calculated item.
    - macro: '{$MERAKI.CLIENTCOUNT.HIGH}'
      value: '50'
      description: Per-network client count above which the high-client-count trigger fires. Also used (x2) as part of the wireless-health-degraded condition.
    - macro: '{$MERAKI.AUTHFAIL.HIGH}'
      value: '20'
      description: Per-network 1h auth-failure count above which the wireless-health-degraded trigger fires.
    - macro: '{$MERAKI.AUTHFAIL.SSID.HIGH}'
      value: '10'
      description: Per-SSID 1h auth-failure count above which the authentication-failure-rate-high trigger fires.
    - macro: '{$MERAKI.CLIENTCOUNT.TREND.THRESHOLD}'
      value: '50'
      description: Percent swing vs the 1h average client count that counts as abnormal.
    - macro: '{$MERAKI.ORG.ID}'
      value: CHANGE_IF_NEEDED
      description: Meraki organization id used by all 4 discovery rules. Distinct from the device template's {$ORGANIZATION_ID} (auto-populated per host by the base template's Devices discovery LLD) -- this one is manually set once at the dashboard/org-host level, since this template is not attached to a per-device host.
