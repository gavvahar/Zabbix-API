                  ? stats.bestEffortTraffic.avg
                  : 0,
              background:
                stats.backgroundTraffic && stats.backgroundTraffic.avg != null
                  ? stats.backgroundTraffic.avg
                  : 0,
            };
          } catch (error) {
            error_msg = error.toString();
          }

          return JSON.stringify({
            result: result,
            error: error_msg,
          });
        parameters:
